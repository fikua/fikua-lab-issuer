# Fikua Lab Issuer — deployment
#
# Image: docker.io/fikua/fikua-lab-issuer (published by the
# fikua/fikua-lab-issuer repo's release.yml on every published release /
# push to main).
#
# Source of truth for this file:
#   fikua-platform-iac/projects/fikua-lab-issuer/compose.yaml
#
# A copy travels with the app repo at fikua-lab-issuer/compose.yaml so
# deploy.yml can push it to the host on every deploy — keep both in sync
# (same convention as niu / fikua-lab-attestation-registry).
#
# Host path on the VPS: /opt/vps/projects/fikua-lab-issuer/
#
# Issuance records persist in a dedicated Postgres instance
# (fikua-lab-issuer-db), following the same one-Postgres-per-project
# pattern as fikua-lab's own fikua-lab-db — there is no shared Postgres
# across fikua-platform-iac projects. Sessions (PAR requests, auth codes,
# access tokens, nonces) stay in-memory, matching the Java issuer's
# InMemorySessionStore. Same deployment shape as
# fikua-lab-attestation-registry otherwise: direct Cloudflare-proxied
# hostname -> Traefik -> container, no Tunnel, no Cloudflare Access, no
# Worker in front.

services:
  fikua-lab-issuer:
    image: ${DOCKER_REGISTRY:-fikua}/fikua-lab-issuer:${ISSUER_VERSION:-latest}
    container_name: fikua-lab-issuer
    restart: unless-stopped
    environment:
      # Go-native DSN (postgresql://user:pass@host:port/db) — NOT the
      # jdbc:postgresql:// format fikua-lab's Java services use.
      FIKUA_DB_URL: postgresql://${FIKUA_ISSUER_POSTGRES_USER:-fikua}:${FIKUA_ISSUER_POSTGRES_PASSWORD}@fikua-lab-issuer-db:5432/fikua_lab_issuer?sslmode=disable
      # Remote signing via the Fikua DSS (tenant 1 — see
      # fikua-lab/dss/compose.yaml). Without these, the issuer refuses to
      # start (internal/crypto.LoadFromPEM has no ephemeral fallback —
      # see its doc comment) rather than sign with a throwaway CA no
      # relying party trusts.
      FIKUA_DSS_URL: ${FIKUA_DSS_URL:-https://dss.fikua.com}
      FIKUA_DSS_CLIENT_ID: ${FIKUA_DSS_CLIENT_ID:-fikua-issuer}
      FIKUA_DSS_CLIENT_SECRET: ${FIKUA_DSS_CLIENT_SECRET:?FIKUA_DSS_CLIENT_SECRET must be set in .env}
      FIKUA_DSS_CREDENTIAL_ID: ${FIKUA_DSS_CREDENTIAL_ID:-fikua-credential-001}
      FIKUA_DSS_CREDENTIAL_PASSWORD: ${FIKUA_DSS_CREDENTIAL_PASSWORD:?FIKUA_DSS_CREDENTIAL_PASSWORD must be set in .env}
    depends_on:
      fikua-lab-issuer-db:
        condition: service_healthy
    networks:
      - default
      - traefik-public
    labels:
      # Direct Cloudflare-proxied A record -> Traefik websecure (443),
      # same pattern as fikua-lab-attestation-registry. Cert comes from
      # the existing *.fikua.com wildcard already configured on the
      # `cloudflare` certResolver — no new ACME request needed.
      traefik.enable: "true"
      traefik.http.routers.fikua-lab-issuer.rule: "Host(`issuer.fikua.com`)"
      traefik.http.routers.fikua-lab-issuer.entrypoints: "websecure"
      traefik.http.routers.fikua-lab-issuer.tls: "true"
      traefik.http.routers.fikua-lab-issuer.service: "fikua-lab-issuer"
      traefik.http.services.fikua-lab-issuer.loadbalancer.server.port: "8080"
      # Rate limit: mirrors attestation-registry's. sourcecriterion.requestheadername
      # is REQUIRED — without it the limiter sees rotating Cloudflare edge
      # IPs (the ratelimit middleware runs before the
      # forwardedHeaders/X-Forwarded-For rewrite) and never fires.
      traefik.http.routers.fikua-lab-issuer.middlewares: "fikua-lab-issuer-ratelimit"
      traefik.http.middlewares.fikua-lab-issuer-ratelimit.ratelimit.average: "60"
      traefik.http.middlewares.fikua-lab-issuer-ratelimit.ratelimit.period: "1m"
      traefik.http.middlewares.fikua-lab-issuer-ratelimit.ratelimit.burst: "100"
      traefik.http.middlewares.fikua-lab-issuer-ratelimit.ratelimit.sourcecriterion.requestheadername: "Cf-Connecting-Ip"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

  fikua-lab-issuer-db:
    image: postgres:17-alpine
    container_name: fikua-lab-issuer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fikua_lab_issuer
      POSTGRES_USER: ${FIKUA_ISSUER_POSTGRES_USER:-fikua}
      POSTGRES_PASSWORD: ${FIKUA_ISSUER_POSTGRES_PASSWORD}
    volumes:
      - issuer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FIKUA_ISSUER_POSTGRES_USER:-fikua}"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Internal-only: no ports:, no traefik labels, no traefik-public — only
    # reachable from fikua-lab-issuer over the default compose network.
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

networks:
  # Shared L7 fabric owned by platform-services — joined for Traefik
  # routing.
  traefik-public:
    name: traefik-public
    external: true

volumes:
  # External volume with a fixed name so the deployment is decoupled from
  # the compose project name (i.e. the host directory). Pre-create it with:
  #   docker volume create fikua-lab-issuer-pgdata
  issuer-pgdata:
    name: fikua-lab-issuer-pgdata
    external: true
