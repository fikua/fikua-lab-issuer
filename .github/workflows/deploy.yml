name: Deploy Issuer to VPS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (defaults to "latest")'
        required: false
        default: 'latest'
        type: string
  release:
    types: [published]

# Don't run two deploys at once against the same VPS.
concurrency:
  group: deploy-fikua-lab-issuer-prd
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag || github.event.release.tag_name || 'latest' }} to prd
    runs-on: ubuntu-latest
    # The 'prd' environment is configured with required reviewers in
    # Settings -> Environments -> prd. Until somebody approves the run,
    # the job stays paused, so an autotrigger from a release publish
    # does not ship to production unsupervised.
    #
    # IMPORTANT: this environment's url assumes DNS for issuer.fikua.com
    # is already pointed at the VPS (see
    # fikua-platform-iac/projects/fikua-lab-issuer/README.md, "First-time
    # setup checklist" step 4).
    environment:
      name: prd
      url: https://issuer.fikua.com/health

    steps:
      - name: Checkout (for the compose file)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install cloudflared
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH client (tunnel + key + known_hosts)
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_id
          chmod 600 ~/.ssh/vps_id
          ssh-keygen -y -f ~/.ssh/vps_id >/dev/null

          cat <<'EOF' > ~/.ssh/config
          Host vps.fikua.com
              User ubuntu
              IdentityFile ~/.ssh/vps_id
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
              ProxyCommand cloudflared access ssh --hostname %h
              ServerAliveInterval 30
              ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config

          echo "CF_ACCESS_CLIENT_ID=$CF_ACCESS_CLIENT_ID" >> "$GITHUB_ENV"
          echo "CF_ACCESS_CLIENT_SECRET=$CF_ACCESS_CLIENT_SECRET" >> "$GITHUB_ENV"

      - name: Write .env on the VPS from environment secrets
        # The .env itself is never committed (see .env.example) and lives
        # only on the VPS host — this step is the automated replacement
        # for editing it there by hand. Values come from the "prd"
        # environment's secrets (Settings -> Environments -> prd ->
        # Environment secrets), so this step only ever runs after the
        # same required-reviewer approval gate as the rest of this job.
        # heredoc + a piped ssh command keeps the values out of both the
        # shell's argv (visible via `ps`) and the workflow log.
        env:
          FIKUA_ISSUER_POSTGRES_PASSWORD: ${{ secrets.FIKUA_ISSUER_POSTGRES_PASSWORD }}
          FIKUA_DSS_CLIENT_SECRET: ${{ secrets.FIKUA_DSS_CLIENT_SECRET }}
          FIKUA_DSS_CREDENTIAL_PASSWORD: ${{ secrets.FIKUA_DSS_CREDENTIAL_PASSWORD }}
        run: |
          set -e
          ssh vps.fikua.com 'sudo mkdir -p /opt/vps/projects/fikua-lab-issuer'
          cat <<EOF | ssh vps.fikua.com 'sudo tee /opt/vps/projects/fikua-lab-issuer/.env > /dev/null && sudo chmod 600 /opt/vps/projects/fikua-lab-issuer/.env && sudo chown ubuntu:ubuntu /opt/vps/projects/fikua-lab-issuer/.env'
          FIKUA_ISSUER_POSTGRES_USER=fikua
          FIKUA_ISSUER_POSTGRES_PASSWORD=$FIKUA_ISSUER_POSTGRES_PASSWORD
          FIKUA_DSS_URL=https://dss.fikua.com
          FIKUA_DSS_CLIENT_ID=fikua-issuer
          FIKUA_DSS_CLIENT_SECRET=$FIKUA_DSS_CLIENT_SECRET
          FIKUA_DSS_CREDENTIAL_ID=fikua-credential-001
          FIKUA_DSS_CREDENTIAL_PASSWORD=$FIKUA_DSS_CREDENTIAL_PASSWORD
          EOF

      - name: Copy compose.yaml from platform-iac source of truth
        # The compose file lives in fikua-platform-iac, but to keep this
        # workflow self-contained we ship the same file alongside the app
        # under compose.yaml; if it isn't present yet we fall back to
        # whatever is already on the VPS.
        run: |
          if [ -f compose.yaml ]; then
            scp compose.yaml vps.fikua.com:/tmp/fikua-lab-issuer-compose.yaml
            ssh vps.fikua.com 'sudo mkdir -p /opt/vps/projects/fikua-lab-issuer && sudo cp /tmp/fikua-lab-issuer-compose.yaml /opt/vps/projects/fikua-lab-issuer/compose.yaml && sudo chown ubuntu:ubuntu /opt/vps/projects/fikua-lab-issuer/compose.yaml'
          else
            echo "::notice::compose.yaml not present in the app repo — keeping the on-host compose file as is."
          fi

      - name: Pull and restart on the VPS
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.event.release.tag_name || 'latest' }}
        run: |
          NORMALISED_TAG="${IMAGE_TAG#v}"
          echo "Deploying fikua/fikua-lab-issuer:$NORMALISED_TAG"
          ssh vps.fikua.com "
            set -e
            cd /opt/vps/projects/fikua-lab-issuer
            ISSUER_VERSION='$NORMALISED_TAG' sudo --preserve-env=ISSUER_VERSION docker compose pull fikua-lab-issuer
            ISSUER_VERSION='$NORMALISED_TAG' sudo --preserve-env=ISSUER_VERSION docker compose up -d
          "

      - name: Wait for /health to report ok
        # The image is built FROM scratch (no shell, no curl/wget inside
        # the container), and the container publishes no host port beyond
        # the 127.0.0.1-bound one — reach it by sharing its network
        # namespace from a throwaway curl container instead of `docker exec`
        # (same trick as attestation-registry's deploy.yml).
        run: |
          for i in $(seq 1 30); do
            body=$(ssh vps.fikua.com 'sudo docker run --rm --network container:fikua-lab-issuer curlimages/curl:latest -sf http://127.0.0.1:8080/health' || true)
            echo "attempt $i: $body" | head -c 400
            echo
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "/health is ok"
              exit 0
            fi
            sleep 5
          done
          echo "/health did not report ok within 150s"
          exit 1

      - name: Smoke-test through Traefik (Host header)
        run: |
          ssh vps.fikua.com \
            'curl -sIk -H "Host: issuer.fikua.com" https://127.0.0.1/health | head -5'
