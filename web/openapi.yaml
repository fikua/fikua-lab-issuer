openapi: 3.0.3
info:
  title: Fikua Lab Issuer
  description: >
    HAIP-only OID4VCI credential issuer for the Fikua Lab EUDI Wallet
    ecosystem. Issues EUDI PID (SD-JWT VC and mdoc); Student ID is not
    supported.

    The OAuth2 authorization server is a separate service,
    fikua-lab-idp — PAR, /authorize and /token are documented there, and
    advertised here via authorization_servers in the Credential Issuer
    Metadata. This service verifies the RFC 9068 JWT access tokens that
    AS mints. DPoP sender-constraining (RFC 9449) remains mandatory on
    every protected endpoint here.
  version: "0.1.0"
  license:
    name: Proprietary
paths:
  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        "200":
          description: >
            Service is healthy, or degraded (the attestation-registry
            catalogue refresh is stale but the last known-good catalogue
            is still being served).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
  /.well-known/openid-credential-issuer:
    get:
      summary: OID4VCI Credential Issuer Metadata
      operationId: credentialIssuerMetadata
      responses:
        "200":
          description: Credential Issuer Metadata document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialIssuerMetadata"
  /oid4vci/v1/jwks:
    get:
      summary: Issuer's public JWK Set
      operationId: jwks
      responses:
        "200":
          description: JWK Set containing the issuer's signing key
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
  /oid4vci/v1/issuance:
    get:
      summary: List issuance records
      operationId: listIssuanceRecords
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, updated_at, status, credential_type]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Paginated issuance records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListIssuanceRecordsResult"
    post:
      summary: Trigger an issuance
      description: >
        Creates an issuance record and returns an authorization_code
        credential offer carrying an issuer_state that links the
        wallet's subsequent PAR-backed /authorize back to this record.
      operationId: triggerIssuance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerIssuanceRequest"
      responses:
        "200":
          description: Issuance triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerIssuanceResult"
        "400":
          $ref: "#/components/responses/OAuthError"
  /oid4vci/v1/credential-offer/{id}:
    get:
      summary: Resolve a by-reference credential_offer_uri
      operationId: credentialOffer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The Credential Offer this id points at
          content:
            application/json:
              schema:
                type: object
                description: An OID4VCI Credential Offer (authorization_code grant, issuer_state set).
        "404":
          description: Unknown or already-expired offer id
  /oid4vci/v1/issuance/by-issuer-state/{issuerState}:
    get:
      summary: Resolve a credential offer's issuer_state to its issuance record
      description: >
        Called by fikua-lab-idp during /authorize, to link a wallet's
        authorization request back to the record that triggered its
        credential offer — the one lookup that authorization server
        cannot do on its own, since the record store lives here. 404 is
        an ordinary answer: a wallet may present a stale issuer_state or
        none at all, and the AS then defers to end-user identification.
      operationId: issuanceByIssuerState
      parameters:
        - name: issuerState
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The issuance record this issuer_state points at
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        "404":
          description: No issuance record matches this issuer_state
  /oid4vci/v1/nonce:
    post:
      summary: Nonce endpoint
      description: >
        Always registers a fresh c_nonce. If an access token is
        presented, a valid DPoP proof (bound to POST
        {issuer}/oid4vci/v1/nonce, with ath) is mandatory and its key
        must match the token's own cnf.jkt claim.
      operationId: nonce
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            example: "DPoP <access_token>"
        - name: DPoP
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Fresh nonce
          content:
            application/json:
              schema:
                type: object
                properties:
                  c_nonce:
                    type: string
        "401":
          $ref: "#/components/responses/OAuthError"
  /oid4vci/v1/credential:
    post:
      summary: Credential endpoint — issues an SD-JWT VC or mdoc credential
      description: >
        Requires a DPoP-bound access token (Bearer is rejected outright)
        and a matching DPoP proof (bound to POST
        {issuer}/oid4vci/v1/credential, with ath).
      operationId: credential
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            example: "DPoP <access_token>"
        - name: DPoP
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialRequest"
      responses:
        "200":
          description: Credential issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialResponse"
        "401":
          $ref: "#/components/responses/OAuthError"
  /oid4vci/v1/notification:
    post:
      summary: Notification endpoint (OID4VCI §10.1) — currently a no-op
      description: >
        This issuer never sets notification_id in a credential response
        yet (immediate, single-credential issuance only), so there is
        nothing to look up or track — any POST here is acknowledged with
        204.
      operationId: notification
      responses:
        "204":
          description: Acknowledged
  /oid4vci/v1/status-list/{listID}:
    get:
      summary: Status List Token (draft-ietf-oauth-status-list-21)
      description: >
        Serves the signed Status List Token JWT that every issued
        credential's `status.status_list.uri` claim points at. Only the
        "pid" list exists — this issuer shares one global status list
        across every credential it issues.
      operationId: statusList
      parameters:
        - name: listID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The signed Status List Token
          content:
            application/statuslist+jwt:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/OAuthError"
  /oid4vci/v1/issuance/{id}/revoke:
    post:
      summary: Revoke an issued credential
      description: >
        Flips the issuance record's status-list entry to INVALID
        (revoked). Only records with status credential_issued and an
        existing status-list entry can be revoked; already-revoked
        records return 204 idempotently.
      operationId: revokeIssuance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked (or already revoked)
        "400":
          $ref: "#/components/responses/OAuthError"

components:
  responses:
    OAuthError:
      description: OAuth2/OID4VCI error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"
  schemas:
    OAuthError:
      type: object
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_grant
            - invalid_client
            - invalid_token
            - invalid_proof
            - invalid_nonce
            - unknown_credential_configuration
            - unknown_credential_identifier
            - invalid_credential_request
        error_description:
          type: string
    CredentialIssuerMetadata:
      type: object
      properties:
        credential_issuer:
          type: string
        authorization_servers:
          type: array
          items:
            type: string
        credential_endpoint:
          type: string
        nonce_endpoint:
          type: string
        notification_endpoint:
          type: string
        credential_configurations_supported:
          type: object
          additionalProperties: true
        display:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              locale:
                type: string
    TriggerIssuanceRequest:
      type: object
      properties:
        credential_type:
          type: string
          description: A credential_configuration_id, e.g. urn:eudi:pid:1 or urn:eudi:pid:1.mdoc. Defaults to urn:eudi:pid:1.
        credential_data:
          type: object
          additionalProperties: true
          example:
            given_name: Max
            family_name: Mustermann
            birthdate: "1990-06-15"
        source_type:
          type: string
        source_ref:
          type: string
    TriggerIssuanceResult:
      type: object
      properties:
        issuance_id:
          type: string
        credential_offer_uri:
          type: string
          description: >
            Resolves via GET /oid4vci/v1/credential-offer/{id} to an
            OID4VCI Credential Offer (authorization_code grant,
            issuer_state set).
          example: "https://issuer.fikua.com/oid4vci/v1/credential-offer/RanT9LlMQaWW81xf9F_7tA"
    ListIssuanceRecordsResult:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/IssuanceRecordView"
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
    IssuanceRecordView:
      type: object
      properties:
        id:
          type: string
        credential_type:
          type: string
        status:
          type: string
        source_type:
          type: string
        source_ref:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        subject_name:
          type: string
        credential_data:
          type: string
          description: JSON-encoded credential data.
    CredentialRequest:
      type: object
      properties:
        credential_configuration_id:
          type: string
          enum: ["urn:eudi:pid:1", "urn:eudi:pid:1.mdoc"]
        proof:
          type: object
          properties:
            proof_type:
              type: string
              enum: [jwt]
            jwt:
              type: string
        proofs:
          type: object
          properties:
            jwt:
              type: array
              items:
                type: string
    CredentialResponse:
      type: object
      properties:
        credentials:
          type: array
          items:
            type: object
            properties:
              credential:
                type: string
                description: A compact SD-JWT VC, or base64url-encoded CBOR IssuerSigned mdoc bytes.
